<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Question 💕</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', cursive, sans-serif;
    }

    body {
      background-color: #ffb6c1; /* Pink background */
      color: #ffffff;           /* All text white */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Cute Chibi Floating Characters Container */
    .chibi-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .chibi-card {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      padding: 10px;
      backdrop-filter: blur(5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      animation: float 3s ease-in-out infinite alternate;
    }

    .chibi-card:nth-child(2) {
      animation-delay: 1s;
    }

    .chibi-card:nth-child(3) {
      animation-delay: 2s;
    }

    .chibi-img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.15));
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(-3deg); }
      100% { transform: translateY(-12px) rotate(3deg); }
    }

    /* Card Box */
    .card {
      background: rgba(255, 105, 180, 0.35);
      border: 3px solid rgba(255, 255, 255, 0.8);
      border-radius: 25px;
      padding: 35px 25px;
      max-width: 450px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.5s ease-in-out forwards;
    }

    .card.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    h1, h2 {
      font-size: 2rem;
      color: #ffffff;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
      margin-bottom: 20px;
      line-height: 1.3;
    }

    .big-emoji {
      font-size: 5rem;
      margin: 15px 0;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    }

    /* Buttons */
    .btn-group {
      display: flex;
      gap: 20px;
      margin-top: 15px;
      width: 100%;
      justify-content: center;
    }

    .btn {
      background-color: #ffffff;
      color: #ff69b4;
      font-size: 1.3rem;
      font-weight: bold;
      padding: 12px 30px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      transition: all 0.2s ease-in-out;
      outline: none;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      background-color: #fff0f5;
    }

    .btn:active {
      transform: translateY(1px);
    }

    /* Floating Hearts Background */
    .heart {
      position: absolute;
      color: rgba(255, 255, 255, 0.6);
      font-size: 20px;
      animation: floatUp 6s linear infinite;
      z-index: -1;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.5);
        opacity: 0;
      }
      50% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Chibi Characters Header -->
  <div class="chibi-container">
    <!-- Chibi Draco Malfoy -->
    <div class="chibi-card" title="Draco Malfoy">
      <svg class="chibi-img" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" fill="#e0e0e0" opacity="0.3"/>
        <path d="M 20,45 Q 50,10 80,45 Q 70,25 50,20 Q 30,25 20,45 Z" fill="#fff59d"/>
        <path d="M 18,40 Q 30,15 50,15 Q 70,15 82,40 Q 80,25 50,20 Q 20,25 18,40 Z" fill="#ffee58"/>
        <circle cx="50" cy="52" r="28" fill="#ffdfd3"/>
        <circle cx="40" cy="50" r="4" fill="#37474f"/>
        <circle cx="60" cy="50" r="4" fill="#37474f"/>
        <circle cx="41" cy="49" r="1.5" fill="#ffffff"/>
        <circle cx="61" cy="49" r="1.5" fill="#ffffff"/>
        <path d="M 46 62 Q 52 65 58 60" stroke="#37474f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M 28,72 Q 50,82 72,72 L 70,82 Q 50,92 30,82 Z" fill="#2e7d32"/>
        <path d="M 38,76 L 44,79 L 42,86 L 36,83 Z" fill="#b0bec5"/>
        <path d="M 56,79 L 62,76 L 64,83 L 58,86 Z" fill="#b0bec5"/>
      </svg>
    </div>

    <!-- Chibi Snoopy -->
    <div class="chibi-card" title="Snoopy">
      <svg class="chibi-img" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" fill="#ffffff" opacity="0.3"/>
        <ellipse cx="45" cy="45" rx="26" ry="22" fill="#ffffff" stroke="#212121" stroke-width="3"/>
        <ellipse cx="62" cy="50" rx="16" ry="12" fill="#ffffff" stroke="#212121" stroke-width="3"/>
        <rect x="42" y="38" width="20" height="20" fill="#ffffff"/>
        <path d="M 25,38 Q 15,55 25,68 Q 38,65 32,45 Z" fill="#212121"/>
        <ellipse cx="76" cy="48" rx="5" ry="4" fill="#212121"/>
        <ellipse cx="48" cy="42" rx="2.5" ry="4" fill="#212121"/>
        <path d="M 58,56 Q 64,60 68,54" stroke="#212121" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M 36,65 Q 48,70 56,65" stroke="#e53935" stroke-width="5" fill="none"/>
      </svg>
    </div>

    <!-- Chibi Kurapika -->
    <div class="chibi-card" title="Kurapika">
      <svg class="chibi-img" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="45" fill="#ffe0b2" opacity="0.3"/>
        <path d="M 15,50 Q 20,10 50,12 Q 80,10 85,50 Q 75,25 50,22 Q 25,25 15,50 Z" fill="#fdd835"/>
        <path d="M 22,35 L 32,55 L 40,32 L 50,58 L 60,32 L 68,55 L 78,35 Q 65,18 50,18 Q 35,18 22,35 Z" fill="#ffeb3b"/>
        <circle cx="50" cy="52" r="26" fill="#ffdfd3"/>
        <ellipse cx="38" cy="52" rx="5" ry="6" fill="#e53935"/>
        <ellipse cx="62" cy="52" rx="5" ry="6" fill="#e53935"/>
        <circle cx="39" cy="50" r="2" fill="#ffffff"/>
        <circle cx="63" cy="50" r="2" fill="#ffffff"/>
        <path d="M 45 64 Q 50 67 55 64" stroke="#d84315" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M 30,76 L 70,76 L 65,92 L 35,92 Z" fill="#1e88e5" stroke="#fdd835" stroke-width="2"/>
      </svg>
    </div>
  </div>

  <!-- SCREEN 1: How was your day? -->
  <div class="card active" id="screen1">
    <h2>How was your day? 💕</h2>
    <div class="btn-group">
      <button class="btn" onclick="nextScreen('screen2')">Yes</button>
      <button class="btn" onclick="nextScreen('screen2')">No</button>
    </div>
  </div>

  <!-- SCREEN 2: Do you want your day to go better? -->
  <div class="card" id="screen2">
    <h2>Do you want your day to go better? ✨</h2>
    <div class="btn-group">
      <button class="btn" onclick="nextScreen('screen3')">Yes</button>
      <button class="btn" onclick="nextScreen('screen3')">No</button>
    </div>
  </div>

  <!-- SCREEN 3: This may make your day wayyy better -->
  <div class="card" id="screen3">
    <h2>This may make your day wayyy better... 😉</h2>
    <div class="btn-group">
      <button class="btn" onclick="nextScreen('screen4')">Continue ✨</button>
    </div>
  </div>

  <!-- SCREEN 4: Will you be my girlfriend? -->
  <div class="card" id="screen4">
    <h2>Will you be my girlfriend? 💖</h2>
    <div class="btn-group">
      <button class="btn" onclick="nextScreen('screenYes')">Yes! 🥰</button>
      <button class="btn" onclick="nextScreen('screenNo')">No 💔</button>
    </div>
  </div>

  <!-- SCREEN 5 (YES): I knew it ;) -->
  <div class="card" id="screenYes">
    <div class="big-emoji">😉</div>
    <h1>I knew it!</h1>
  </div>

  <!-- SCREEN 5 (NO): Okay :( -->
  <div class="card" id="screenNo">
    <div class="big-emoji">🙁</div>
    <h1>Okay</h1>
  </div>

  <script>
    function nextScreen(screenId) {
      const cards = document.querySelectorAll('.card');
      cards.forEach(card => card.classList.remove('active'));

      const targetCard = document.getElementById(screenId);
      if (targetCard) {
        targetCard.classList.add('active');
      }
    }

    function createHearts() {
      const heartCount = 15;
      for (let i = 0; i < heartCount; i++) {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerHTML = '💖';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
        heart.style.animationDelay = Math.random() * 5 + 's';
        document.body.appendChild(heart);
      }
    }

    createHearts();
  </script>
</body>
</html>
